name: Lloyd Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lloyd-hunter
  cancel-in-progress: false

jobs:

  hunt:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python hunter.py

      - name: Save results and Telegram state
        run: |
          git config user.name "Lloyd Hunter"
          git config user.email "actions@users.noreply.github.com"

          git add results.csv telegram_offset.txt

          if git diff --cached --quiet; then
            echo "No new results or Telegram commands."
          else
            git commit -m "Update hunt results"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Prepare website data
        run: |
          cp results.csv site/results.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show website URL
        run: |
          echo "Lloyd Hunter website:"
          echo "${{ steps.deployment.outputs.page_url }}"
