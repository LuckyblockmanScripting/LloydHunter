name: Lloyd Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hunter
        run: |
          python hunter.py

      - name: Save results
        run: |
          git config user.name "Lloyd Hunter"
          git config user.email "actions@users.noreply.github.com"

          git add results.csv

          git diff --cached --quiet || git commit -m "Update hunt results"

          git push
